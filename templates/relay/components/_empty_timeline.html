<div class="gantt-empty">
    <span class="gantt-empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 10h18"/>
            <path d="M8 3v4M16 3v4"/>
        </svg>
    </span>
    <h3>No assignments scheduled</h3>
    <p>Start the first assignment to begin tracking this truck.</p>
    {% if can_edit and show_start_assignment %}
        <button type="button" class="btn btn-primary" data-modal-open="start-assignment">Start Assignment</button>
    {% endif %}
</div>
